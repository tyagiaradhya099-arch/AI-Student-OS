<!DOCTYPE html>
<html>

<head>

    <title>Pomodoro</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="pomodoro-page">

    <!-- HEADER -->

    <header class="pomodoro-header">

        <h1>🍅 Pomodoro Focus</h1>

        <p>Stay focused, one session at a time.</p>

    </header>

    <!-- DASHBOARD -->

    <main class="dashboard">

        <!-- LEFT SIDE -->

        <section class="timer-panel">

            <div class="timer-card">

                <svg class="progress-ring" width="320" height="320">

                    <circle
                        class="progress-bg"
                        cx="160"
                        cy="160"
                        r="145">
                    </circle>

                    <circle
                        class="progress-bar"
                        cx="160"
                        cy="160"
                        r="145">
                    </circle>

                </svg>

                <div class="timer-content">

                    <h2 id="timer">25:00</h2>

                    <p class="session-type">
                        🍅 Focus Session
                    </p>

                </div>

            </div>

        </section>

        <!-- RIGHT SIDE -->

        <section class="controls-panel">

            <div class="control-card">

                <label>🍅 Focus Time</label>

                <input
                    type="number"
                    class="time-input"
                    value="25">

            </div>

            <div class="control-card">

                <label>☕ Break Time</label>

                <input
                    type="number"
                    class="time-input"
                    value="5">

            </div>

            <div class="button-group">

                <button id="startBtn">▶ Start</button>

                <button id="pauseBtn">⏸ Pause</button>

                <button id="resetBtn">🔄 Reset</button>

            </div>

        </section>

    </main>

    <!-- STATS -->

    <section class="stats-grid">

        <div class="stat-card">

            <span>🍅</span>

            <h3>Sessions</h3>

            <p id="sessionsCount">0</p>

        </div>

        <div class="stat-card">

            <span>🔥</span>

            <h3>Streak</h3>

            <p id="streakCount">0</p>

        </div>

        <div class="stat-card">

            <span>⏱</span>

            <h3>Focus Time</h3>

            <p id="focusMinutes">0 min</p>

        </div>

    </section>

    <a href="/" class="back-btn">

        ← Back to Home

    </a>

</div>

<script src="{{ url_for('static', filename='js/pomodoro.js') }}"></script>

</body>

</html>
