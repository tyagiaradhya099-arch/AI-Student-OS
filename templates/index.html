<!DOCTYPE html>
<html>

<head>
    <title>AI Student OS</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="container">

        <h1>AI Student OS 🚀</h1>

        <!-- ADD TASK FORM -->
        <form method="POST">

            <div class="input-section">

                <input type="text"
                name="task"
                placeholder="Enter your task">

                <button type="submit">
                    Add
                </button>

            </div>

        </form>

        <!-- CLEAR BUTTON -->
        <form method="POST">

            <button
            type="submit"
            name="clear"
            value="true"
            class="clear-btn">

                Clear Tasks

            </button>

        </form>

        <!-- TASK LIST -->
        <ul>

            {% for task in tasks %}

                <li>

                    {{ task }}

                    <form method="POST" style="display:inline;">

                        <button
                        type="submit"
                        name="delete"
                        value="{{ loop.index0 }}">

                            Delete

                        </button>

                    </form>

                </li>

            {% endfor %}

        </ul>

    </div>

</body>

</html>
