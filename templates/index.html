<!DOCTYPE html>
<html>

<head>

    <title>AI Student OS</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <div class="container">

        <h1>AI Student OS 🚀</h1>

        <!-- STATS SECTION -->

        <div class="stats">

            <div class="stat-box">
                <h3>Total</h3>
                <p>{{ total_tasks }}</p>
            </div>

            <div class="stat-box">
                <h3>Completed</h3>
                <p>{{ completed_tasks }}</p>
            </div>

            <div class="stat-box">
                <h3>Remaining</h3>
                <p>{{ remaining_tasks }}</p>
            </div>

        </div>

        <!-- ADD TASK FORM -->

        <form method="POST">

            <div class="input-section">

                
                    <select name="priority">

                       <option value="High">High 🔴</option>

                       <option value="Medium">Medium 🟡</option>

                       <option value="Low">Low 🟢</option>

                    </select>

                    <input

                     type="text"
                     name="task"
                     placeholder="Enter your task">

                     <button type="submit">
                      Add
                     </button>

            </div>

        </form>

        <br>

        <!-- CLEAR BUTTON -->

        <form method="POST">

            <button
            type="submit"
            name="clear"
            value="true"
            class="clear-btn">

                Clear Tasks

            </button>

        </form>

        <!-- TASK LIST -->

        <ul>

            {% for task in tasks %}

                <li>

                    <div>

                        {% if task.done %}

                            <s>{{ task.text }}</s>

                        {% else %}

                            {{ task.priority }} - {{ task.text }}

                        {% endif %}

                    </div>

                    <div>

                        <!-- COMPLETE BUTTON -->

                        <form method="POST" style="display:inline;">

                            <button
                            type="submit"
                            name="complete"
                            value="{{ loop.index0 }}">

                                Complete

                            </button>

                        </form>

                        <!-- DELETE BUTTON -->

                        <form method="POST" style="display:inline;">

                            <button
                            type="submit"
                            name="delete"
                            value="{{ loop.index0 }}">

                                Delete

                            </button>

                        </form>

                    </div>

                </li>

            {% endfor %}

        </ul>

    </div>

</body>

</html>
