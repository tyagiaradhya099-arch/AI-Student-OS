<!DOCTYPE html>
<html>

<head>

    <title>AI Student OS</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <div class="container">

        <h1>AI Student OS 🚀</h1>

        <!-- ADD TASK FORM -->
        <form method="POST">

            <div class="input-section">

                <input
                type="text"
                name="task"
                placeholder="Enter your task">

                <button type="submit">
                    Add
                </button>

            </div>

        </form>

        <br>

        <!-- CLEAR TASKS -->
        <form method="POST">

            <button
            type="submit"
            name="clear"
            value="true"
            class="clear-btn">

                Clear Tasks

            </button>

        </form>

        <!-- TASK LIST -->
        <ul>

            {% for task in tasks %}

                <li>

                    <!-- TASK TEXT -->

                    {% if task.done %}

                        <s>{{ task.text }}</s>

                    {% else %}

                        {{ task.text }}

                    {% endif %}

                    <!-- BUTTONS -->

                    <div>

                        <!-- COMPLETE BUTTON -->

                        <form method="POST" style="display:inline;">

                            <button
                            type="submit"
                            name="complete"
                            value="{{ loop.index0 }}">

                                Complete

                            </button>

                        </form>

                        <!-- DELETE BUTTON -->

                        <form method="POST" style="display:inline;">

                            <button
                            type="submit"
                            name="delete"
                            value="{{ loop.index0 }}">

                                Delete

                            </button>

                        </form>

                    </div>

                </li>

            {% endfor %}

        </ul>

    </div>

</body>

</html>
